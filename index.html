<!doctype html>
<html lang="nl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b14"><title>VM Monitor</title>
<style>
:root{color-scheme:dark;--bg:#070b14;--card:#111827;--muted:#94a3b8;--line:#233047;--ok:#38d996;--warn:#fbbf24;--bad:#fb7185;--blue:#60a5fa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f8fafc;font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:760px;margin:auto;padding:14px 14px 72px}.top{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 82%,transparent);padding:10px 0 16px}
h1{font-size:18px;margin:0 0 10px}.hero{border:1px solid var(--line);border-radius:18px;padding:16px;background:#0d1526}.hero.ok{border-color:#1f6d56}.hero.action{border-color:#9b6b12}.hero.error{border-color:#8a3044}
.hero strong{font-size:24px;display:block}.sub{color:var(--muted);margin-top:5px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.chip{background:#172033;border:1px solid var(--line);border-radius:99px;padding:5px 9px;font-size:12px}
section{margin-top:18px}h2{font-size:15px;margin:0 0 9px;color:#dbeafe}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.metric,.service,.job{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.metric b{display:block;font-size:20px}.metric span,.tiny{color:var(--muted);font-size:12px}.services{display:grid;gap:8px}.service{display:flex;justify-content:space-between;align-items:center}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px;background:var(--muted)}.dot.run{background:var(--ok)}
.filters{display:flex;gap:7px;overflow:auto;padding-bottom:5px}.filters button{white-space:nowrap;border:1px solid var(--line);background:#0d1526;color:#cbd5e1;border-radius:99px;padding:7px 10px}.filters button.active{background:#1e3a5f;color:white;border-color:#315b8d}
.jobs{display:grid;gap:9px;margin-top:9px}.job{padding:13px}.jobhead{display:flex;gap:10px;align-items:flex-start}.badge{font-size:11px;font-weight:700;padding:4px 7px;border-radius:7px;background:#243047}
.badge.active{background:#123c32;color:#7ef0c3}.badge.review{background:#173b62;color:#93c5fd}.badge.waiting,.badge.action{background:#50370b;color:#fde68a}.badge.error{background:#4c1723;color:#fda4af}.badge.done{background:#1d2939;color:#a8b3c5}
.title{font-weight:700;flex:1}.now{margin:9px 0 0;color:#dce6f5}.meta{margin-top:8px;color:var(--muted);font-size:12px}.progress{height:5px;background:#263147;border-radius:99px;overflow:hidden;margin-top:9px}.progress i{display:block;height:100%;background:var(--blue)}
details{margin-top:9px;border-top:1px solid var(--line);padding-top:8px}summary{cursor:pointer;color:#a9b9ce;font-size:12px}.tech{font:12px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;color:#a9b9ce;overflow-wrap:anywhere;margin-top:7px}
.actionbox{margin-top:9px;padding:9px;border-radius:9px;background:#3f2c0b;color:#fde68a}.empty{color:var(--muted);padding:20px 4px}footer{margin-top:24px;color:var(--muted);font-size:11px;text-align:center}@media(min-width:620px){.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body><main>
<div class="top"><h1>VM Monitor</h1><div id="hero" class="hero"><strong>Laden…</strong><div class="sub">Status wordt opgehaald.</div></div></div>
<section><h2>VM</h2><div class="grid" id="vm"></div></section>
<section><h2>Belangrijkste services</h2><div class="services" id="services"></div></section>
<section><h2>Orchestrator-jobs</h2><div class="filters" id="filters"></div><div class="jobs" id="jobs"></div></section>
<footer id="footer"></footer></main><script>
const labels={all:"Alles",active:"Werkt",review:"Review",waiting:"Wacht",action:"Actie nodig",error:"Fout",done:"Klaar"};let data=null,filter="all";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function age(iso){if(!iso)return"onbekend";let s=Math.max(0,(Date.now()-new Date(iso))/1000);if(s<90)return Math.round(s)+" sec geleden";if(s<5400)return Math.round(s/60)+" min geleden";if(s<172800)return Math.round(s/3600)+" uur geleden";return Math.round(s/86400)+" dagen geleden"}
function fmtTokens(n){if(!n)return"0";return n>999999?(n/1e6).toFixed(1)+"M":n>999?(n/1e3).toFixed(0)+"k":String(n)}
function renderHero(){const c=data.summary||{},needs=c.action||0,errors=c.error||0,hero=document.querySelector("#hero");hero.className="hero "+(needs?"action":errors?"error":"ok");const working=(c.active||0)+(c.review||0),headline=needs?"ACTIE NODIG":errors?"CHECK AANBEVOLEN":"ALLES GOED";const msg=needs?(needs+" job"+(needs===1?"":"s")+" "+(needs===1?"heeft":"hebben")+" jou nodig."):(working+" job"+(working===1?"":"s")+" werken · "+(c.waiting||0)+" wacht · 0 hebben jou nodig");hero.innerHTML="<strong>"+headline+"</strong><div class=sub>"+msg+"</div><div class=chips><span class=chip>"+(c.active||0)+" actief</span><span class=chip>"+(c.review||0)+" review</span><span class=chip>"+(c.done||0)+" klaar</span><span class=chip>"+(c.error||0)+" fout</span></div>"}
function renderVM(){const v=data.vm||{};document.querySelector("#vm").innerHTML=[["CPU/load",(v.cpu_load_pct??"?")+"%","load "+(v.load_1m??"?")],["RAM",(v.ram_used_pct??"?")+"%","in gebruik"],["Schijf",(v.disk_used_pct??"?")+"%",(v.disk_free_gb??"?")+" GB vrij"],["Uptime",Math.round((v.uptime_hours||0)/24)+" d",(v.uptime_hours??"?")+" uur"]].map(x=>"<div class=metric><b>"+x[1]+"</b><span>"+x[0]+" · "+x[2]+"</span></div>").join("")}
function renderServices(){document.querySelector("#services").innerHTML=(data.services||[]).map(s=>"<div class=service><span><i class='dot "+(s.status==="running"?"run":"")+"'></i>"+esc(s.label)+"</span><span class=tiny>"+(s.count?s.count+" actief":"rustig")+"</span></div>").join("")}
function renderFilters(){const order=["all","active","review","waiting","action","error","done"];document.querySelector("#filters").innerHTML=order.map(k=>"<button data-f='"+k+"' class='"+(filter===k?"active":"")+"'>"+labels[k]+(k==="all"?"":" ("+(data.summary?.[k]||0)+")")+"</button>").join("");document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{filter=b.dataset.f;renderFilters();renderJobs()})}
function jobCard(j){const pct=j.batch&&j.max_steps?Math.min(100,Math.round(j.batch/j.max_steps*100)):null,cost=j.cost_usd?" · $"+Number(j.cost_usd).toFixed(2):"",action=j.status==="action"&&j.human_question?"<div class=actionbox><b>Jij moet iets doen:</b><br>"+esc(j.human_question)+"</div>":"";return "<article class=job><div class=jobhead><span class='badge "+j.status+"'>"+(labels[j.status]||esc(j.status))+"</span><div class=title>"+esc(j.title)+"</div></div><div class=now>"+esc(j.now)+"</div>"+action+"<div class=meta>"+(j.batch?"Batch "+j.batch+(j.max_steps?" van max. "+j.max_steps:"")+" · ":"")+"laatste activiteit "+age(j.last_activity)+" · "+(j.calls||0)+" AI-calls · "+fmtTokens(j.tokens)+" tokens"+cost+"</div>"+(pct!==null?"<div class=progress><i style='width:"+pct+"%'></i></div>":"")+"<details><summary>Technische details</summary><div class=tech>job: "+esc(j.id)+"<br>fase: "+esc(j.phase)+"<br>stap: "+esc(j.step||"—")+"<br>model: "+esc(j.last_model||"—")+"<br>laatste activiteit: "+esc(j.last_activity)+"</div></details></article>"}
function renderJobs(){let jobs=[...(data.jobs||[])],rank={action:0,error:1,active:2,review:3,waiting:4,done:5};jobs.sort((a,b)=>(rank[a.status]-rank[b.status])||new Date(b.last_activity)-new Date(a.last_activity));if(filter!=="all")jobs=jobs.filter(j=>j.status===filter);document.querySelector("#jobs").innerHTML=jobs.length?jobs.map(jobCard).join(""):"<div class=empty>Geen jobs in deze categorie.</div>"}
function render(){renderHero();renderVM();renderServices();renderFilters();renderJobs();document.querySelector("#footer").textContent="Laatste VM-update: "+new Date(data.generated_at).toLocaleString("nl-NL")+" · dashboard ververst elke 60 seconden · read-only"}
async function load(){try{const r=await fetch("status.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);data=await r.json();render()}catch(e){document.querySelector("#hero").className="hero error";document.querySelector("#hero").innerHTML="<strong>GEEN VERSE DATA</strong><div class=sub>"+esc(e.message)+"</div>"}}
load();setInterval(load,60000);
</script></body></html>
