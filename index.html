<!doctype html>
<html lang="nl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071018"><title>Orchestrator Monitor</title>
<style>
:root{color-scheme:dark;--bg:#071018;--card:#101b28;--line:#233548;--text:#f8fafc;--muted:#91a4b8;--green:#34d399;--blue:#60a5fa;--amber:#fbbf24;--red:#fb7185}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:620px;margin:auto;padding:16px 14px 60px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
h1{font-size:19px;margin:0}.refresh,.hide,.restore{min-height:44px;border-radius:12px;border:1px solid #35506c;background:#132236;color:#fff;font-weight:700}
.refresh{padding:0 14px}.hide{min-height:36px;padding:0 10px;font-size:12px;background:#0d1724;color:#a9bbcc;border-color:#26384b}.restore{min-height:36px;padding:0 10px;font-size:12px;background:transparent;color:#9fb2c4;border-color:#26384b}
.summary{color:var(--muted);font-size:13px;margin:-7px 0 8px}.capacity{background:#0d1825;border:1px solid var(--line);border-radius:16px;padding:13px;margin:10px 0 12px}.caphead{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.caplabel{font-weight:800}.capadvice{font-size:12px;color:var(--muted);text-align:right}.meters{display:grid;gap:7px;margin-top:10px}.meterrow{display:grid;grid-template-columns:52px 1fr 42px;gap:8px;align-items:center;font-size:12px;color:#b9c8d8}.meter{height:7px;background:#223247;border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,#3b82f6,#34d399);border-radius:99px}.capfoot{margin-top:8px;font-size:11px;color:#71879b}.hiddenrow{display:flex;justify-content:flex-end;margin-bottom:12px}
.jobs{display:grid;gap:12px}.job{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px}
.toprow{display:flex;align-items:flex-start;gap:10px}.titlewrap{flex:1;min-width:0}.name{font-size:17px;font-weight:750;min-width:0}.pct{font-size:27px;font-weight:800;line-height:1}
.state{display:inline-block;margin-top:6px;font-size:11px;font-weight:800;border-radius:999px;padding:4px 8px;background:#1c2a3c;color:#cbd5e1}
.state.active,.state.review{background:#12392f;color:#8ef0c7}.state.waiting{background:#4a3811;color:#fde68a}.state.action{background:#48330d;color:#fde68a}.state.error{background:#481826;color:#fda4af}.state.done{background:#17364a;color:#b9e0ff}
.bar{height:9px;background:#223247;border-radius:999px;overflow:hidden;margin:14px 0 12px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#3b82f6,#34d399);border-radius:999px}
.what{font-size:15px;color:#e6edf5}.phase{margin-top:8px;color:var(--muted);font-size:13px}.age{margin-top:10px;color:#7f93a8;font-size:12px}
.need{margin-top:10px;padding:9px 10px;border-radius:10px;background:#3b2c10;color:#fde68a;font-size:13px}
.actions{display:flex;justify-content:flex-end;margin-top:10px}.donebox{margin-top:22px}.donebox h2{font-size:14px;color:#b9c8d8;margin:0 0 8px}.recent{display:grid;gap:7px}.recent .row{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;color:#cbd5e1;font-size:13px}
.empty{padding:24px 8px;color:var(--muted);text-align:center;border:1px dashed var(--line);border-radius:16px}
footer{text-align:center;color:#6f8398;font-size:11px;margin-top:20px}
@media(min-width:520px){.job{padding:18px}}
</style></head><body><main>
<div class="head"><h1>Orchestrator Monitor</h1><button id="refresh" class="refresh" type="button">↻ Vernieuwen</button></div>
<div id="summary" class="summary">Actuele status ophalen…</div>
<div id="capacity" class="capacity"><div class="caphead"><span class="caplabel">VM-belasting laden…</span><span class="capadvice"></span></div><div class="meters"></div><div class="capfoot"></div></div>
<div id="hiddenRow" class="hiddenrow" hidden><button id="restore" class="restore" type="button"></button></div>
<div id="jobs" class="jobs"></div>
<div id="recentWrap" class="donebox" hidden><h2>Recent klaar</h2><div id="recent" class="recent"></div></div>
<footer id="footer"></footer>
</main><script>
const STATUS_URL="https://raw.githubusercontent.com/gert66/vm-monitor/live/status.json";
const DEFAULT_HIDDEN=["ai-challenge-department-v2-20260918","smart-parking-ai-demo-20260918"];
const HIDDEN_KEY="orchestrator-monitor-hidden-v2",INIT_KEY="orchestrator-monitor-init-v2";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function getHidden(){try{return new Set(JSON.parse(localStorage.getItem(HIDDEN_KEY)||"[]"))}catch{return new Set()}}
function saveHidden(s){localStorage.setItem(HIDDEN_KEY,JSON.stringify([...s]))}
if(!localStorage.getItem(INIT_KEY)){saveHidden(new Set(DEFAULT_HIDDEN));localStorage.setItem(INIT_KEY,"1")}
function age(iso){const s=Math.max(0,(Date.now()-new Date(iso))/1000);if(s<90)return"zojuist";if(s<5400)return Math.round(s/60)+" min geleden";if(s<172800)return Math.round(s/3600)+" uur geleden";return Math.round(s/86400)+" dagen geleden"}
function hoursOld(j){return (Date.now()-new Date(j.last_activity))/36e5}
function title(j){const m={"ai-challenge-v3-integrated-20260918":"Challengepagina V3","ai-challenge-department-v2-20260918":"Challengepagina V2","smart-parking-ai-demo-20260918":"Parking Who First","live-import-flow-update":"Live import flow update","overnight-path-planner-20260917":"3D Pathfinding","path-planner-gemini-final-20260917":"3D Pathfinding laatste run","overnight-maze-chase-20260916":"Maze Chase","overnight-rubik-2x2-20260917":"Rubik 2×2","overnight-electron-dose-lab-20260917":"Electron Dose Lab","overnight-mosse-tracker-20260917":"MOSSE Tracker"};return m[j.id]||j.title}
function progress(j){if(Number.isFinite(j.progress))return Math.max(0,Math.min(100,j.progress));if(j.status==="done")return 100;const t=((j.step||"")+" "+(j.now||"")).toLowerCase();if(/final|integrale|eind|comparative|audit|laatste review/.test(t))return 95;if(j.status==="review")return 90;if(j.status==="action"&&!j.batch)return 10;if(j.batch){const base=Math.min(88,20+(j.batch-1)*13);return Math.max(15,base)}if(j.status==="error")return 70;return 35}
function phaseText(j,p){const t=((j.step||"")+" "+(j.now||"")).toLowerCase();if(j.id==="live-import-flow-update"&&j.status==="active")return"Laatste correcties en daarna build/test";if(j.id==="live-import-flow-update"&&j.status==="waiting")return"Geen recente bestandsactiviteit, mogelijk gepauzeerd";if(p>=95)return"Laatste controlefase";if(j.status==="review")return"Review van de huidige stap";if(j.status==="action")return"Wacht op een noodzakelijke beslissing";if(j.status==="error")return"Gestopt door een fout";if(/test/.test(t))return"Testen";if(/review/.test(t))return"Review";if(/build|create|maak|bouw/.test(t))return"Bouwen";if(j.batch)return"Stap "+j.batch+(j.max_steps?" van maximaal "+j.max_steps:"");return"Bezig"}
function useful(j){if(j.id.startsWith("feedback-"))return false;if(j.id==="hermes-advisory-smoke-001")return false;return hoursOld(j)<=12}
function currentJobs(all){const h=getHidden();return all.filter(j=>useful(j)&&j.status!=="done"&&!h.has(j.id)).sort((a,b)=>new Date(b.last_activity)-new Date(a.last_activity))}
function recentDone(all){const h=getHidden();return all.filter(j=>j.status==="done"&&hoursOld(j)<=4&&!j.id.startsWith("feedback-")&&!h.has(j.id)).sort((a,b)=>new Date(b.last_activity)-new Date(a.last_activity)).slice(0,5)}
function hideJob(id){const h=getHidden();h.add(id);saveHidden(h);load()}
function statusLabel(s){return s==="active"?"BEZIG":s==="review"?"REVIEW":s==="waiting"?"MOGELIJK GEPAUZEERD":s==="action"?"WACHT OP JOU":s==="error"?"GESTOPT":"KLAAR"}
function card(j){const p=progress(j);const need=j.status==="action"&&j.human_question?'<div class="need">Wacht op jou: '+esc(j.human_question)+'</div>':"";return '<article class="job"><div class="toprow"><div class="titlewrap"><div class="name">'+esc(title(j))+'</div><span class="state '+j.status+'">'+esc(statusLabel(j.status))+'</span></div><div class="pct">'+p+'%</div></div><div class="bar"><i style="width:'+p+'%"></i></div><div class="what">'+esc(j.now)+'</div><div class="phase">'+esc(phaseText(j,p))+(j.batch?" · batch "+j.batch:"")+'</div>'+need+'<div class="age">Laatste activiteit '+age(j.last_activity)+'</div><div class="actions"><button class="hide" type="button" data-hide="'+esc(j.id)+'">✓ Klaar / weg uit overzicht</button></div></article>'}
function updateHiddenRow(){const n=getHidden().size;$("#hiddenRow").hidden=!n;$("#restore").textContent=n+" weggeklikt · herstellen"}
function renderCapacity(d){const v=d.vm||{},cap=d.capacity||{},box=$("#capacity"),vals=[["CPU",Number(v.cpu_load_pct||0)],["RAM",Number(v.ram_used_pct||0)],["Schijf",Number(v.disk_used_pct||0)]];box.querySelector(".caplabel").textContent="VM-belasting: "+(cap.label||"ONBEKEND");box.querySelector(".capadvice").textContent=cap.advice||"";box.querySelector(".meters").innerHTML=vals.map(x=>'<div class="meterrow"><span>'+x[0]+'</span><div class="meter"><i style="width:'+Math.min(100,x[1])+'%"></i></div><span>'+Math.round(x[1])+'%</span></div>').join("");box.querySelector(".capfoot").textContent=(cap.heavy_tasks||0)+" zware/actieve taken · "+(v.disk_free_gb??"?")+" GB schijfruimte vrij"}
async function load(){const btn=$("#refresh");btn.disabled=true;btn.textContent="Bezig…";try{const r=await fetch(STATUS_URL+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);const d=await r.json(),cur=currentJobs(d.jobs||[]),done=recentDone(d.jobs||[]);renderCapacity(d);$("#summary").textContent=cur.length?cur.length+" actuele werkjob"+(cur.length===1?"":"s")+" gevonden.":"Geen actieve werkjobs gevonden.";$("#jobs").innerHTML=cur.length?cur.map(card).join(""):'<div class="empty">Op dit moment is er geen actuele werkjob zichtbaar.</div>';document.querySelectorAll("[data-hide]").forEach(b=>b.addEventListener("click",()=>hideJob(b.dataset.hide)));$("#recentWrap").hidden=!done.length;$("#recent").innerHTML=done.map(j=>'<div class="row"><span>'+esc(title(j))+'</span><span>Klaar · '+age(j.last_activity)+'</span></div>').join("");updateHiddenRow();$("#footer").textContent="VM-status van "+new Date(d.generated_at).toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"})+" · automatisch elke minuut bijgewerkt"}catch(e){$("#summary").textContent="Status kon niet worden opgehaald.";$("#jobs").innerHTML='<div class="empty">'+esc(e.message)+'</div>'}finally{btn.disabled=false;btn.textContent="↻ Vernieuwen"}}
$("#refresh").addEventListener("click",load);
$("#restore").addEventListener("click",()=>{saveHidden(new Set());load()});
load();setInterval(load,60000);
</script></body></html>
