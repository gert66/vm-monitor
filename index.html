<!doctype html>
<html lang="nl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b14"><title>mYngle Control Center</title>
<style>
:root{color-scheme:dark;--bg:#070b14;--card:#111827;--muted:#94a3b8;--line:#233047;--ok:#38d996;--warn:#fbbf24;--bad:#fb7185;--blue:#60a5fa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f8fafc;font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:860px;margin:auto;padding:14px 14px 80px}.top{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 86%,transparent);padding:8px 0 15px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand h1{font-size:18px;margin:0}.stamp{font-size:11px;color:var(--muted)}
nav{display:flex;gap:7px;overflow:auto;margin-top:12px}nav button{white-space:nowrap;border:1px solid var(--line);background:#0d1526;color:#cbd5e1;border-radius:99px;padding:8px 12px}
nav button.active{background:#1e3a5f;color:#fff;border-color:#315b8d}.page{display:none}.page.active{display:block}
.hero{border:1px solid var(--line);border-radius:18px;padding:16px;background:#0d1526;margin-top:4px}.hero.healthy{border-color:#1f6d56}.hero.warning{border-color:#9b6b12}.hero.critical{border-color:#8a3044}
.hero strong{font-size:25px;display:block}.sub{color:var(--muted);margin-top:5px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.chip{background:#172033;border:1px solid var(--line);border-radius:99px;padding:5px 9px;font-size:12px}
section{margin-top:18px}h2{font-size:15px;margin:0 0 9px;color:#dbeafe}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.metric,.service,.job,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.metric b{display:block;font-size:20px}.metric span,.tiny{color:var(--muted);font-size:12px}.services,.jobs{display:grid;gap:8px}.service{display:flex;justify-content:space-between;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px;background:var(--muted)}.dot.run{background:var(--ok)}
.job{padding:13px}.jobhead{display:flex;gap:9px;align-items:flex-start}.badge{font-size:11px;font-weight:700;padding:4px 7px;border-radius:7px;background:#243047}.badge.active{background:#123c32;color:#7ef0c3}.badge.review{background:#173b62;color:#93c5fd}.badge.waiting,.badge.action{background:#50370b;color:#fde68a}.badge.error{background:#4c1723;color:#fda4af}.badge.done{background:#1d2939;color:#a8b3c5}
.title{font-weight:700;flex:1}.now{margin-top:8px;color:#dce6f5}.meta{margin-top:7px;color:var(--muted);font-size:12px}.actionbox{margin-top:9px;padding:9px;border-radius:9px;background:#3f2c0b;color:#fde68a}
.filters{display:flex;gap:7px;overflow:auto;padding-bottom:6px}.filters button{white-space:nowrap;border:1px solid var(--line);background:#0d1526;color:#cbd5e1;border-radius:99px;padding:7px 10px}.filters button.active{background:#1e3a5f;color:white}
.chart{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:9px}canvas{width:100%;height:170px;display:block}.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:11px;margin-top:5px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px 5px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:500}td:last-child,th:last-child{text-align:right}
.empty{color:var(--muted);padding:18px 2px}footer{margin-top:25px;color:var(--muted);font-size:11px;text-align:center}@media(min-width:640px){.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body><main>
<div class="top"><div class="brand"><h1>mYngle Control Center</h1><span class="stamp" id="stamp">laden…</span></div>
<nav><button data-page="overview" class="active">Vandaag</button><button data-page="machine">Machine</button><button data-page="jobs">Jobs</button><button data-page="costs">Kosten</button></nav></div>
<div id="overview" class="page active"></div><div id="machine" class="page"></div><div id="jobs" class="page"></div><div id="costs" class="page"></div>
<footer>Read-only · ververst iedere minuut · VM blijft bron van waarheid</footer>
</main><script>
let data=null,filter="all";const labels={all:"Alles",active:"Werkt",review:"Review",waiting:"Wacht",action:"Actie nodig",error:"Fout",done:"Klaar"};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"$"+Number(n||0).toFixed(2);const num=n=>Number(n||0).toLocaleString("nl-NL");
function age(iso){if(!iso)return"onbekend";let s=Math.max(0,(Date.now()-new Date(iso))/1000);if(s<90)return Math.round(s)+" sec";if(s<5400)return Math.round(s/60)+" min";if(s<172800)return Math.round(s/3600)+" uur";return Math.round(s/86400)+" d"}
function metric(label,value,sub=""){return '<div class="metric"><b>'+esc(value)+'</b><span>'+esc(label)+(sub?' · '+esc(sub):'')+'</span></div>'}
function jobCard(j){const action=j.status==="action"&&j.human_question?'<div class="actionbox"><b>Jouw actie nodig</b><br>'+esc(j.human_question)+'</div>':"";return '<article class="job"><div class="jobhead"><span class="badge '+j.status+'">'+(labels[j.status]||esc(j.status))+'</span><div class="title">'+esc(j.title)+'</div></div><div class="now">'+esc(j.now)+'</div>'+action+'<div class="meta">laatste activiteit '+age(j.last_activity)+' geleden · '+num(j.calls)+' AI-calls · '+num(j.tokens)+' tokens · '+money(j.cost_usd)+(j.last_model?' · '+esc(j.last_model):'')+'</div></article>'}
function overview(){
 const v=data.vm||{},s=data.summary||{},c=data.costs?.periods||{},state=(data.health_state||"UNKNOWN").toUpperCase(),needs=s.action||0;
 let msg=needs?needs+" job"+(needs===1?"":"s")+" heeft jouw actie nodig.":"Geen jobs wachten op jouw actie.";
 let reasons=(data.health_reasons||[]).length?" · "+data.health_reasons.join(" · "):"";
 let hero='<div class="hero '+state.toLowerCase()+'"><strong>'+state+'</strong><div class="sub">'+esc(msg+reasons)+'</div><div class="chips"><span class="chip">'+(s.active||0)+' actief</span><span class="chip">'+needs+' actie nodig</span><span class="chip">'+(s.error||0)+' fout</span><span class="chip">'+money(c.today?.cost_usd)+' vandaag</span></div></div>';
 let m='<section><h2>Nu</h2><div class="grid">'+metric("RAM",(v.ram_used_pct??"?")+"%",(v.ram_used_gb??"?")+"/"+(v.ram_total_gb??"?")+" GB")+metric("CPU",(v.cpu_used_pct??"?")+"%","load "+(v.load_5m??"?"))+metric("Schijf",(v.disk_used_pct??"?")+"%",(v.disk_free_gb??"?")+" GB vrij")+metric("Kosten vandaag",money(c.today?.cost_usd),num(c.today?.calls)+" calls")+'</div></section>';
 let actions=(data.jobs||[]).filter(j=>j.status==="action").slice(0,8);let a='<section><h2>Actie nodig</h2><div class="jobs">'+(actions.length?actions.map(jobCard).join(""):'<div class="empty">Geen interventies nodig.</div>')+'</div></section>';
 let sv='<section><h2>Kernservices</h2><div class="services">'+(data.services||[]).map(x=>'<div class="service"><span><i class="dot '+(x.status==="running"?"run":"")+'"></i>'+esc(x.label)+'</span><span class="tiny">'+esc(x.status)+(x.count?' · '+x.count:'')+'</span></div>').join("")+'</div></section>';
 document.querySelector("#overview").innerHTML=hero+m+a+sv;
}
function draw(canvas,points,key,label,maxHint=100){const ctx=canvas.getContext("2d"),dpr=window.devicePixelRatio||1,w=canvas.clientWidth,h=170;canvas.width=w*dpr;canvas.height=h*dpr;ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);ctx.strokeStyle="#233047";ctx.lineWidth=1;for(let i=0;i<5;i++){let y=10+i*(h-25)/4;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}let vals=points.map(p=>Number(p[key])).filter(Number.isFinite);if(!vals.length){ctx.fillStyle="#94a3b8";ctx.fillText("Nog onvoldoende historie",10,25);return}let max=Math.max(maxHint,Math.max(...vals)*1.1),min=0;ctx.strokeStyle="#60a5fa";ctx.lineWidth=2;ctx.beginPath();let started=false;points.forEach((p,i)=>{let val=Number(p[key]);if(!Number.isFinite(val))return;let x=i/Math.max(points.length-1,1)*(w-8)+4,y=h-12-(val-min)/(max-min)*(h-24);if(!started){ctx.moveTo(x,y);started=true}else ctx.lineTo(x,y)});ctx.stroke();ctx.fillStyle="#94a3b8";ctx.font="11px system-ui";ctx.fillText(label+" · max "+Math.max(...vals).toFixed(1),8,13)}
function machine(){
 const v=data.vm||{},pts=data.history?.last_24h||[],days=data.history?.daily_30d||[];
 let cards='<div class="grid">'+metric("RAM",(v.ram_used_pct??"?")+"%",(v.ram_available_gb??"?")+" GB beschikbaar")+metric("CPU",(v.cpu_used_pct??"?")+"%",(v.cpu_count??"?")+" cores")+metric("Load 5m",v.load_5m??"?","1m "+(v.load_1m??"?")+" · 15m "+(v.load_15m??"?"))+metric("Schijf",(v.disk_used_pct??"?")+"%",(v.disk_free_gb??"?")+" GB vrij")+'</div>';
 let charts='<section><h2>Afgelopen 24 uur</h2><div class="chart"><canvas id="ramChart"></canvas></div><div class="chart"><canvas id="cpuChart"></canvas></div><div class="chart"><canvas id="loadChart"></canvas></div></section>';
 let rows=days.slice().reverse().map(d=>'<tr><td>'+esc(d.day)+'</td><td>'+d.ram_avg+'% / '+d.ram_max+'%</td><td>'+d.cpu_avg+'% / '+d.cpu_max+'%</td><td>'+d.disk_max+'%</td></tr>').join("");
 let table='<section><h2>Dagtrend</h2><div class="panel"><table><thead><tr><th>Dag</th><th>RAM avg/max</th><th>CPU avg/max</th><th>Disk max</th></tr></thead><tbody>'+rows+'</tbody></table></div></section>';
 document.querySelector("#machine").innerHTML=cards+charts+table;requestAnimationFrame(()=>{draw(document.querySelector("#ramChart"),pts,"ram","RAM %");draw(document.querySelector("#cpuChart"),pts,"cpu","CPU %");draw(document.querySelector("#loadChart"),pts,"load","Load",Math.max(1,(v.cpu_count||1)))});
}
function jobs(){
 let order=["all","action","active","review","waiting","error","done"],buttons='<div class="filters">'+order.map(k=>'<button data-filter="'+k+'" class="'+(filter===k?"active":"")+'">'+labels[k]+' '+(k==="all"?"":'('+(data.summary?.[k]||0)+')')+'</button>').join("")+'</div>';
 let items=[...(data.jobs||[])],rank={action:0,error:1,active:2,review:3,waiting:4,done:5};items.sort((a,b)=>(rank[a.status]-rank[b.status])||String(b.last_activity).localeCompare(String(a.last_activity)));if(filter!=="all")items=items.filter(j=>j.status===filter);
 document.querySelector("#jobs").innerHTML='<section><h2>Orchestrator-jobs</h2>'+buttons+'<div class="jobs">'+(items.length?items.map(jobCard).join(""):'<div class="empty">Geen jobs in deze categorie.</div>')+'</div></section>';
 document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;jobs()});
}
function costs(){
 const p=data.costs?.periods||{},models=data.costs?.models_30d||[],providers=data.costs?.providers_30d||[];
 let cards='<div class="grid">'+metric("Vandaag",money(p.today?.cost_usd),num(p.today?.calls)+" calls")+metric("7 dagen",money(p["7d"]?.cost_usd),num(p["7d"]?.tokens)+" tokens")+metric("30 dagen",money(p["30d"]?.cost_usd),num(p["30d"]?.calls)+" calls")+metric("Tokens 30d",num(p["30d"]?.tokens),"geregistreerd")+'</div>';
 let mt=models.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+num(x.calls)+'</td><td>'+num(x.tokens)+'</td><td>'+money(x.cost_usd)+'</td></tr>').join("");
 let pt=providers.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+num(x.calls)+'</td><td>'+num(x.tokens)+'</td><td>'+money(x.cost_usd)+'</td></tr>').join("");
 document.querySelector("#costs").innerHTML=cards+'<section><h2>Per model · 30 dagen</h2><div class="panel"><table><thead><tr><th>Model</th><th>Calls</th><th>Tokens</th><th>Kosten</th></tr></thead><tbody>'+mt+'</tbody></table></div></section><section><h2>Per provider · 30 dagen</h2><div class="panel"><table><thead><tr><th>Provider</th><th>Calls</th><th>Tokens</th><th>Kosten</th></tr></thead><tbody>'+pt+'</tbody></table></div></section>';
}
function render(){overview();machine();jobs();costs();document.querySelector("#stamp").textContent="update "+age(data.generated_at)+" geleden"}
async function load(){try{const r=await fetch("status.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);data=await r.json();render()}catch(e){document.querySelector("#overview").innerHTML='<div class="hero critical"><strong>GEEN VERSE DATA</strong><div class="sub">'+esc(e.message)+'</div></div>'}}
document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-page]").forEach(x=>x.classList.toggle("active",x===b));document.querySelectorAll(".page").forEach(x=>x.classList.toggle("active",x.id===b.dataset.page));if(b.dataset.page==="machine"&&data)machine()});
load();setInterval(load,60000);window.addEventListener("resize",()=>{if(data&&document.querySelector("#machine").classList.contains("active"))machine()});
</script></body></html>
